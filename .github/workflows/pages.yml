name: Deploy suspension viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify calculations
        run: python -m unittest discover -s tests

      - name: Build self-contained viewer
        run: python suspension_linkage_forces.py examples/mk11_reference.json --output-dir outputs

      - name: Assemble Pages site
        run: |
          mkdir -p _site/downloads
          cp outputs/suspension_linkages_3d_current.html _site/index.html
          cp outputs/suspension_forces.json _site/downloads/
          cp outputs/suspension_forces.csv _site/downloads/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
